async function loadProducts() {
  try {
    const snapshot = await db.collection("products").get();

    products = snapshot.docs.map(doc => ({
      id: doc.id,
      ...doc.data()
    }));

    document.getElementById("loading").style.display = "none";
    renderProducts();

  } catch (error) {
    document.getElementById("loading").innerText =
      "Unable to load products. Refresh the page.";
    console.error(error);
  }
}

function filterProducts(category) {
  currentFilter = category;
  renderProducts();
}

function renderProducts() {
  const list = document.getElementById("productList");
  list.innerHTML = "";

  const filtered = products.filter(p =>
    p.active !== false &&
    (currentFilter === "All" || p.category === currentFilter)
  );

  if (!filtered.length) {
    list.innerHTML = "<p>No products available.</p>";
    return;
  }

  filtered.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.src = p.imageUrl || "";
    img.alt = p.name || "Product";
    img.onerror = () => img.style.display = "none";

    const name = document.createElement("h3");
    name.textContent = p.name || "";

    const price = document.createElement("p");
    price.className = "price";
    price.textContent = "₹" + p.price + " / " + (p.unit || "unit");

    const stock = document.createElement("p");
    stock.textContent = Number(p.stock) > 0
      ? "Available: " + p.stock
      : "Out of stock";

    const btn = document.createElement("button");
    btn.textContent = "Add to Cart";
    btn.disabled = !(Number(p.stock) > 0);
    btn.onclick = () => addToCart(p.id);

    card.append(img,name,price,stock,btn);
    list.appendChild(card);
  });
}

function addToCart(id) {
  const p = products.find(x => x.id === id);

  if (!p || Number(p.stock) <= 0) {
    alert("Out of stock");
    return;
  }

  const existing = cart.find(x => x.id === id);

  if (existing) {
    if (existing.qty >= Number(p.stock)) {
      alert("Stock limit reached");
      return;
    }
    existing.qty++;
  } else {
    cart.push({
      id:p.id,
      name:p.name,
      price:Number(p.price),
      unit:p.unit || "unit",
      qty:1,
      stock:Number(p.stock)
    });
  }

  updateCartCount();
  alert("Added to cart!");
}

function updateCartCount() {
  document.getElementById("cartCount").innerText =
    cart.reduce((sum,x) => sum + x.qty,0);
} function renderCart() {
  const box = document.getElementById("cartItems");
  box.innerHTML = "";

  let total = 0;

  if (cart.length === 0) {
    box.innerHTML = "<p>Your cart is empty.</p>";
  }

  cart.forEach((item,index) => {
    total += item.price * item.qty;

    const row = document.createElement("div");
    row.className = "panel";

    const info = document.createElement("span");
    info.textContent =
      item.name + " × " + item.qty +
      " = ₹" + (item.price * item.qty);

    const minus = document.createElement("button");
    minus.textContent = "-";
    minus.onclick = () => changeQty(index,-1);

    const plus = document.createElement("button");
    plus.textContent = "+";
    plus.onclick = () => changeQty(index,1);

    const remove = document.createElement("button");
    remove.textContent = "Remove";
    remove.className = "danger";
    remove.onclick = () => {
      cart.splice(index,1);
      updateCartCount();
      renderCart();
    };

    row.append(info,minus,plus,remove);
    box.appendChild(row);
  });

  document.getElementById("cartTotal").innerText = total;
}

function changeQty(index,change) {
  const item = cart[index];
  const newQty = item.qty + change;

  if (newQty <= 0) {
    cart.splice(index,1);
  } else if (newQty > item.stock) {
    alert("Available stock: " + item.stock);
  } else {
    item.qty = newQty;
  }

  updateCartCount();
  renderCart();
}
